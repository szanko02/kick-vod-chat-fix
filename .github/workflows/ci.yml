name: CI

on:
  push:
    branches: [main, master, 'codex/*']
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Lint extension
        run: npm run lint

      - name: Build extension artifact
        run: npm run build

      - name: Pack review source archive
        run: npm run pack-source
